<!DOCTYPE html>
<html lang="en">
<head>
    <title>Facebook Login</title>
</head>
<body>
    <h2 style="text-align: center;">Facebook Login Page</h2>
    <form action="">
         <label for="Firstname">
            <input  type="Firstname" placeholder="Firstname">
            <button>Enter</button> 
         </label> <br> <br> <br>

         <label for="Lastname">
            <input  type="Lastname" placeholder="Lastname">
            <button>Enter</button> 
         </label> <br> <br> <br>

         <label for="email">
            <input  type="email" placeholder="email">
            <button>Enter</button> 
         </label> <br> <br> <br>

         <label for="tel">
            <input  type="tel" placeholder="tel">
            <button>Enter</button> 
         </label> <br> <br> <br>

         <label for="password">
            <input  type="password" placeholder="password">
            <button>Enter</button> 
         </label> <br> <br>
    </form>
    <h2>Thanks for signing up</h2>
</body>
</html>
